name: master

on:
  push:
    branches: [master]

# Single source of truth for the published image coordinates and platforms.
env:
  IMAGE: ghcr.io/ilyavassyutovich/exiftool
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Two publishes running at once could interleave their tag moves.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Moving tags for a superseded commit would roll users back; fail loudly
      # instead and leave the retry to a human (D17).
      - name: Refuse to publish a superseded commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip="$(gh api "repos/$REPO/commits/master" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            echo "::error::$SHA is not the tip of master ($tip); publish from the newest commit instead"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version="$(sed -n 's/^ARG EXIFTOOL_VERSION=//p' Containerfile)"
          test -n "$version" || { echo "EXIFTOOL_VERSION not found in Containerfile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Needed only once PLATFORMS gains a non-native architecture.
      - if: env.PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed by digest only: tags move after the digest is signed and tested.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Build-specific labels only: the Containerfile owns licenses and title, which
          # describe the image's contents rather than this repo (D12).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify attestation and signature
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo IlyaVassyutovich/exiftool-container
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github\.com/IlyaVassyutovich/exiftool-container/\.github/workflows/master\.yml@refs/heads/master$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Smoke-test the published image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash tests/smoke.sh "$IMAGE@$DIGEST"
      # imagetools copies a single-source index without rewriting it, so the
      # tags end up on exactly the digest that was signed and tested.
      - name: Move tags to the verified digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          for tag in latest "$VERSION"; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')"
            test "$actual" = "$DIGEST" || { echo "$IMAGE:$tag is $actual, expected $DIGEST" >&2; exit 1; }
          done
