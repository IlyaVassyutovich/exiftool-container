name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Single source of truth for the published image coordinates and platforms.
env:
  IMAGE: ghcr.io/ilyavassyutovich/exiftool
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build:
    name: build-and-smoke-test
    runs-on: ubuntu-latest
    steps:
      # Nothing in CI pushes to git, so the token need not stay in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # `load: true` supports a single platform only, so this job always builds
      # linux/amd64 regardless of PLATFORMS; multi-platform builds belong to publish.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: exiftool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash tests/smoke.sh exiftool:ci

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Serialises publishes so two never push at once; it does not order them by
    # commit, which the "current tip" guard step below takes care of.
    concurrency:
      group: publish-master
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A queued run for an older commit must not move the tags back after a
      # newer commit has already been published.
      - id: guard
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip="$(gh api "repos/$REPO/commits/master" --jq .sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping publish: $SHA is not the tip of master ($tip)"
          fi
      - if: steps.guard.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        if: steps.guard.outputs.current == 'true'
        run: |
          version="$(sed -n 's/^ARG EXIFTOOL_VERSION=//p' Containerfile)"
          test -n "$version" || { echo "EXIFTOOL_VERSION not found in Containerfile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Needed only once PLATFORMS gains a non-native architecture.
      - if: steps.guard.outputs.current == 'true' && env.PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.guard.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.guard.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed by digest only: tags move after the digest is signed and tested.
      - id: push
        if: steps.guard.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Build-specific labels only: the Containerfile owns licenses and title, which
          # describe the image's contents rather than this repo (D12).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.guard.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: steps.guard.outputs.current == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign image
        if: steps.guard.outputs.current == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify attestation and signature
        if: steps.guard.outputs.current == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo IlyaVassyutovich/exiftool-container
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github\.com/IlyaVassyutovich/exiftool-container/\.github/workflows/ci\.yml@refs/heads/master$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Smoke-test the published image
        if: steps.guard.outputs.current == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash tests/smoke.sh "$IMAGE@$DIGEST"
      # imagetools copies a single-source index without rewriting it, so the
      # tags end up on exactly the digest that was signed and tested.
      - name: Move tags to the verified digest
        if: steps.guard.outputs.current == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          for tag in latest "$VERSION"; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')"
            test "$actual" = "$DIGEST" || { echo "$IMAGE:$tag is $actual, expected $DIGEST" >&2; exit 1; }
          done
