name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Single source of truth for the published image coordinates and platforms.
env:
  IMAGE: ghcr.io/ilyavassyutovich/exiftool
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build:
    name: build-and-smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # `load: true` supports a single platform only, so this job always builds
      # linux/amd64 regardless of PLATFORMS; multi-platform builds belong to publish.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: exiftool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash tests/smoke.sh exiftool:ci
