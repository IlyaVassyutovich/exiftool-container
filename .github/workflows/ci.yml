name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Single source of truth for the published image coordinates and platforms.
env:
  IMAGE: ghcr.io/ilyavassyutovich/exiftool
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build:
    name: build-and-smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # `load: true` supports a single platform only, so this job always builds
      # linux/amd64 regardless of PLATFORMS; multi-platform builds belong to publish.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: exiftool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash tests/smoke.sh exiftool:ci

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialised without cancelling so a later merge cannot be overtaken by an
    # earlier, slower run and leave latest/<version> pointing at older content.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version="$(sed -n 's/^ARG EXIFTOOL_VERSION=//p' Containerfile)"
          test -n "$version" || { echo "EXIFTOOL_VERSION not found in Containerfile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Needed only once PLATFORMS gains a non-native architecture.
      - if: env.PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify attestation and signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo IlyaVassyutovich/exiftool-container
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github\.com/IlyaVassyutovich/exiftool-container/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Smoke-test the published image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash tests/smoke.sh "$IMAGE@$DIGEST"
